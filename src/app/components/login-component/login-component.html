<div class="login-layout">
  <div class="login-intro d-none d-lg-flex">
    <span class="eyebrow">PORTAL SEGURO</span>
    <h1>Tu espacio de trabajo,<br><span>protegido.</span></h1>
    <p>Accede a tus herramientas y mantén el control de tu equipo en todo momento.</p>
    <div class="security-badge">⌁ &nbsp; Acceso cifrado y protegido</div>
  </div>
  <div class="login-card surface-card">
    <div class="text-center text-lg-start mb-4">
      <div class="login-symbol"></div>
      <h2 class="mt-3 mb-2">Bienvenido de nuevo</h2>
      <p class="text-white-50 mb-0">Introduce tus credenciales para continuar.</p>
    </div>
    <form #formLogin="ngForm" (ngSubmit)="loginEmpleado()">
      <div class="mb-3">
        <label for="username" class="form-label">Nombre de usuario</label>
        <input id="username" type="text" name="cajauser" #cajauser required class="form-control form-control-lg" placeholder="Tu usuario"/>
      </div>
      <div class="mb-4">
        <label for="password" class="form-label">Contraseña</label>
        <input id="password" type="password" name="cajapass" #cajapass required class="form-control form-control-lg" placeholder="••••••••"/>
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="!formLogin.valid">Iniciar sesión <span>→</span></button>
    </form>
    @if (mensaje) {
      <div class="alert alert-success mt-4 mb-0" role="status">✓ {{ mensaje }}</div>
    }
  </div>
</div>
