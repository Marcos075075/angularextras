<h1>Equipos</h1>
<div class="d-flex flex-row">
@for (equi of equipos; track equi) {
    <div class="card" style="width: 18rem;">
        <img src="{{equi.imagen}}" class="card-img-top" alt="..."/>
        <div class="card-body">
            <h5 class="card-title">{{equi.nombre}}</h5>
            <p class="card-text">Cahmpions: {{equi.champions}}</p>
            <p class="card-text">Descripcion: {{equi.descripcion}}</p>
        </div>
    </div>
}
</div>
