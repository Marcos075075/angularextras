<section class="upload-card">
  <h1>Subir ficheros</h1>
  <p class="upload-description">Selecciona un fichero para comenzar la carga.</p>

  <form createform="ngForm" class="upload-form">
    <label for="file-input">Seleccione un fichero:</label>
    <input id="file-input" type="file" name="cajaimg" #cajaimg class="form-control" required/>
    <button type="submit" class="upload-button" (click)="subirImagen()">Pulse para subir fichero</button>
  </form>
</section>
